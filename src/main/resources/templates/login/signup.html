<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="/css/footer.css">
    <link rel="stylesheet" type="text/css" href="/css/group.css">
    <title>Дипломник |Створення нової групи</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg nav-dark" style="background-color: #9F1C21;">
        <div class="container">
            <a class="navbar-brand" href="/diplomnic">
                <img src="/images/logo_red.jpg" alt="НТУ ХПІ" width="75px" height="75px">
            </a>
        </div>
    </nav>
    <main>
        <div class="form-containers">
            <div class="form-card">
                <div class="form-container">
                    <div class="form-header">
                        <h5>Створення нової групи</h5>
                    </div>
                    <div class="form-body">
                        <form th:action="@{/register/save}" enctype="multipart/form-data"  th:object="${user}" method="post">
                            <div class="form-group mb-3">
                                <label class="control-label"> Повне ім'я</label>
                                <input
                                        type="text"
                                        id="supervisorName"
                                        name="supervisorName"
                                        class="form-control"
                                        placeholder="Уведіть ваше ім'я"
                                        autocomplete="off"
                                        maxlength="100"
                                        th:field="*{name}"
                                        spellcheck="false"
                                        required
                                />
                            </div>
                            <div class="form-group mb-3">
                                <label class="control-label">Пошта</label>
                                <input
                                        id="email"
                                        name="email"
                                        class="form-control"
                                        autocomplete="off"
                                        th:field="*{email}"
                                        placeholder="Уведіть вашу пошту"
                                        maxlength="100"
                                        type="email"
                                        spellcheck="false"
                                        required
                                />
                            </div>
                            <div class="form-group mb-3">
                                <label class="control-label">Вчене звання</label>
                                <input
                                        id="academicRang"
                                        name="academicRang"
                                        class="form-control"
                                        autocomplete="off"
                                        th:field="*{academicRang}"
                                        placeholder="Уведіть вашу вчене звання"
                                        maxlength="100"
                                        required
                                        spellcheck="false"
                                        type="text"
                                />
                            </div>
                            <div class="form-group mb-3">
                                <label class="control-label">Вчена ступінь</label>
                                <input
                                        id="academicDegree"
                                        name="academicDegree"
                                        class="form-control"
                                        autocomplete="off"
                                        th:field="*{academicDegree}"
                                        placeholder="Уведіть вашу вчену ступінь"
                                        maxlength="100"
                                        type="text"
                                        spellcheck="false"
                                />
                            </div>
                            <div class="form-group mb-3">
                                <label class="form-label">Пароль</label>
                                <input
                                        class="form-control"
                                        id="password"
                                        name="password"
                                        minlength="8"
                                        pattern="^[A-Za-z0-9]+$"
                                        placeholder="Уведіть пароль"
                                        title="Пароль повинен містити тільки англійські букви и цифри"
                                        th:field="*{password}"
                                        type="password"
                                        required
                                />
                            </div>
                            <div class="center-container">
                                <button type="submit" class="submit-button register">Зареєструватися</button>
                                <br>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="image-container">
                    <img src="/images/background_3.jpg" alt="">
                </div>
            </div>
        </div>
    </main>
    <nav class="" style="background-color: white">
        <div class="line-container">
            <div class="custom-line"></div>
        </div>
        <div class="footer-container">
            <div class="left-container">
                <div class="image">
                    <img src="/images/logo_white.png" alt=""></img>
                </div>
                <div class="text">
                    <a style="color: #9F1C21; text-align: center">НТУ “ХПІ”<br></a>
                    <a style="color: #9F1C21"><br>Вищий навчальний заклад IV ступеню акредитації державної форми<br>
                        власності, підпорядкований Міністерству освіти й науки України<br><br> в 2010 році отримав статус дослідницького національного університету</a>
                </div>
            </div>
            <div class="right-container">
                <div style="color: #9F1C21">
                    <a style="color: #9F1C21; text-align: center" >Наша адреса<br></a>
                    <a><br>НТУ "ХПІ"<br>вул. Кирпичова, 2<br>Харків, 61002<br>Україна</a>
                </div>
            </div>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
